<!DOCTYPE html>
<html lang="it">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Didattica Online - Giulia Marro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
        }

        .card-minimal {
            background-color: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 1.5rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-minimal:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .preview-box {
            background-color: #f1f3f5;
            border-radius: 8px;
            padding: 2rem 1rem;
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .preview-placeholder {
            color: #6c757d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .tag-badge {
            display: inline-block;
            background-color: #e9ecef;
            color: #495057;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            margin-bottom: 0.5rem;
            margin-right: 0.25rem;
        }

        .tag-materia {
            background-color: #e3f2fd;
            color: #0d6efd;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #212529;
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .card-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }

        .feature-list {
            list-style: none;
            padding-left: 0;
            font-size: 0.85rem;
            color: #495057;
            margin-bottom: 1.5rem;
        }
